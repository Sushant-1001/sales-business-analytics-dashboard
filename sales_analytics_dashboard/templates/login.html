<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sales Analytics Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .login-title {
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .login-subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-login {
            width: 100%;
            padding: 11px;
            font-weight: 600;
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- Logo -->
        <div class="logo">
            📊
        </div>

        <!-- Title -->
        <h2 class="login-title">
            Sales Analytics
        </h2>

        <p class="login-subtitle">
            Login to your dashboard
        </p>


        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert alert-{{ category }} alert-dismissible fade show"
                         role="alert">

                        {{ message }}

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                        </button>

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Login Form -->
        <form action="{{ url_for('login') }}" method="POST">

            <!-- Username -->
            <div class="mb-3">

                <label for="username" class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <!-- Password -->
            <div class="mb-4">

                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <!-- Login Button -->
            <button
                type="submit"
                class="btn btn-primary btn-login">
                Login
            </button>

        </form>

    </div>

</div>


<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
